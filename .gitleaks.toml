# Secret scanning (CI "quality" job): gitleaks' default rules, plus an
# allowlist for dummy values that tests and CI use on purpose. Real keys
# never belong in the repository; production values live in the server's
# environment (docs/DEPLOYMENT.md).
title = "WP CareGrid gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Dummy test and CI values (not secrets)"
regexes = [
  # Test fixtures: storage and Stripe placeholders that only exist in tests.
  '''test-secret-key-do-not-log''',
  '''test-access-key''',
  '''sk_test_unit[A-Za-z_]*''',
  '''sk_test_SECRET_STRIPE_KEY_123''',
  '''pk_test_PUBLISHABLE_456''',
  '''whsec_WEBHOOK_SECRET_789''',
  '''whsec_test[A-Za-z0-9_]*''',
    # Historical M11 test placeholder introduced before it was renamed to the standard dummy form.
    '''whsec_m11_fixture''',
  '''AKIA_STORAGE_KEY''',
  '''STORAGE_SECRET_VALUE''',
  # Synthetic Owner Console walkthrough marker from M14.1 tests; exact value only.
  '''S3_OWNER_WALKTHROUGH_SECRET''',
  '''SMTP_PASSWORD_VALUE''',
  '''FEED_KEY_VALUE''',
  # Connector test harness (wordpress/tests): fixed pairing credential and
  # admin-access token that only ever reach FakeHttp inside the test WordPress.
  # Exact values, so any other key in the same files is still reported.
  '''cgc_Zx8Kq2Lm4Np6Rs8Tu0Vw2Xy4Za6Bc8De0Fg2Hi4Jk6Lm8Np0''',
  '''29df881a559de2edae17f5bbd0e93517f98d3e295f59d52864f795516b5ca42a''',
  # Throw-away CI database password and WordPress test salts.
  '''ci-root-password''',
  '''wp-caregrid-tests-[a-z_]+''',
  # Factory and test passwords for throw-away test users.
  '''password-123456''',
  '''(chosen|owner|operator|other)-password-[0-9]+''',
]
paths = [
  '''composer\.lock''',
  '''package-lock\.json''',
  '''wordpress/composer\.lock''',
]
