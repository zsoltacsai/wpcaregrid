version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
      routine-updates:
        applies-to: version-updates
        patterns:
          - "*"
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: friday
      time: "19:00"
      timezone: Europe/Budapest
    open-pull-requests-limit: 5
    groups:
