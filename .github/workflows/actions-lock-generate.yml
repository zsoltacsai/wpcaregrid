name: Temporary actions lock generation

on:
  pull_request:
    paths:
      - '.github/workflows/actions-lock-generate.yml'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-ci-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install immutable gh-actions-lock release and verify binary digest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_LOCK_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export GH_CONFIG_DIR="$RUNNER_TEMP/gh-config"
          gh extension install github/gh-actions-lock --pin v0.4.0
          gh extension list
          echo "HOME=$HOME GH_CONFIG_DIR=$GH_CONFIG_DIR"
          find "$HOME" "$RUNNER_TEMP" -type f -name gh-actions-lock -print 2>/dev/null | head -20
          binary="$(find "$HOME" "$RUNNER_TEMP" -type f -name gh-actions-lock -print -quit 2>/dev/null)"
          test -n "$binary" && test -x "$binary"
          echo "f9da98f2a6e9e0ae77deadf9a2319a8a86bb002b541cc3203b247cc59fb04842  $binary" | sha256sum --check

      - name: Generate lockfile for CI only without narrowing existing refs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_LOCK_GITHUB_COM_TOKEN: ${{ github.token }}
        run: gh actions-lock --no-narrow .github/workflows/ci.yml

      - name: Verify lockfile and prove intentional action-ref drift fails
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_LOCK_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh actions-lock --verify .github/workflows/ci.yml
          cp .github/workflows/ci.yml "$RUNNER_TEMP/ci.yml.original"
          restore() {
            cp "$RUNNER_TEMP/ci.yml.original" .github/workflows/ci.yml
          }
          trap restore EXIT
          sed -i 's#actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1#actions/checkout@main#' .github/workflows/ci.yml
          set +e
          gh actions-lock --verify .github/workflows/ci.yml
          status=$?
          set -e
          if [[ "$status" -eq 0 ]]; then
            echo "Lock verification accepted intentional action reference drift." >&2
            exit 1
          fi
          echo "Expected result: lock verification rejected an intentional action-ref drift."
          restore
          trap - EXIT
          git diff --exit-code -- .github/workflows/ci.yml

      - name: Print generated lockfile for source review
        run: cat .github/workflows/actions.lock

      - name: Upload generated lockfile for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ci-actions-lock-candidate
          path: .github/workflows/actions.lock
          if-no-files-found: error
          retention-days: 1
