name: Package B confidential reproduction — diagnostic only

on:
  push:
    branches:
      - codex/package-b-confidential-repro

permissions:
  contents: read

concurrency:
  group: package-b-confidential-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted:
    name: Confidential Package B test (PHP ${{ matrix.php }}, disposable MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify Composer and PHPUnit bootstrap inputs
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [[ ! -f vendor/autoload.php || ! -f vendor/bin/phpunit || ! -f phpunit.xml ]]; then
            echo 'COMPOSER_BOOTSTRAP=FAIL'
            exit 1
          fi
          echo 'COMPOSER_BOOTSTRAP=PASS'

      - name: Provision fresh disposable application database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          set -euo pipefail
          set +x
          app_password="$(openssl rand -hex 32)"
          echo "::add-mask::$app_password"
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root \
            --execute="SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE caregrid_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'caregrid_ci'@'%' IDENTIFIED BY '$app_password'; GRANT ALL PRIVILEGES ON caregrid_test.* TO 'caregrid_ci'@'%';" \
            >/dev/null 2>&1
          {
            printf '%s\n' 'DB_CONNECTION=mysql' 'DB_HOST=127.0.0.1' 'DB_PORT=3306'
            printf '%s\n' 'DB_DATABASE=caregrid_test' 'DB_USERNAME=caregrid_ci' "DB_PASSWORD=$app_password" 'DB_URL='
          } >> "$GITHUB_ENV"

      - name: Verify disposable database connection
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if ! MYSQL_PWD="$DB_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 \
            --user="$DB_USERNAME" "$DB_DATABASE" --execute='SELECT 1' >/dev/null 2>&1; then
            echo 'APP_DATABASE=FAIL'
            exit 1
          fi
          echo 'APP_DATABASE=PASS'

      - name: Download and verify immutable age v1.3.2 binary
        shell: bash
        run: |
          set -euo pipefail
          set +x
          age_root="$(mktemp -d "$RUNNER_TEMP/wpcg-age-v1.3.2.XXXXXX")"
          chmod 700 "$age_root"
          printf 'WPCG_AGE_TEMP_DIR=%s\n' "$age_root" >> "$GITHUB_ENV"
          archive="$age_root/age-v1.3.2-linux-amd64.tar.gz"
          extract_root="$age_root/extract"
          mkdir -m 700 "$extract_root"
          if ! curl --fail --silent --show-error --location --max-filesize 25000000 \
            --connect-timeout 15 --max-time 120 \
            --output "$archive" \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz'; then
            echo 'AGE_DOWNLOAD=FAILED'
            exit 1
          fi
          expected='cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10'
          actual="$(sha256sum "$archive" | cut -d ' ' -f 1)"
          if [[ "$actual" != "$expected" ]]; then
            echo 'AGE_ARCHIVE_DIGEST=FAILED'
            exit 1
          fi
          if ! tar -xzf "$archive" -C "$extract_root" age/age >/dev/null 2>&1; then
            echo 'AGE_ARCHIVE_EXTRACTION=FAILED'
            exit 1
          fi
          chmod 700 "$extract_root/age/age"
          version="$(timeout 5s "$extract_root/age/age" --version 2>/dev/null || true)"
          if [[ "$version" != 'age v1.3.2' && "$version" != 'v1.3.2' ]]; then
            echo 'AGE_VERSION=FAILED'
            exit 1
          fi
          printf 'WPCG_AGE_BIN=%s\n' "$extract_root/age/age" >> "$GITHUB_ENV"
          echo 'AGE_TOOL=VERIFIED'
          echo 'AGE_ARCHIVE_DIGEST=PASS'

      - name: Synthetic confidential-output contract
        run: python3 scripts/ci/package-b-confidential-repro.py --self-test

      - name: Run exactly one selected PHPUnit test and encrypt raw output
        id: targeted
        shell: bash
        env:
          PHP_VERSION: ${{ matrix.php }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/ci/package-b-confidential-repro.py \
            --run --php-version "$PHP_VERSION" --age-bin "$WPCG_AGE_BIN"

      - name: Upload encrypted diagnostic only
        id: encrypted_artifact
        if: always() && steps.targeted.outputs.artifact_created == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-b-confidential-${{ matrix.php }}
          path: ${{ runner.temp }}/wpcg-package-b-confidential-${{ matrix.php }}.age
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

      - name: Verify encrypted artifact upload receipt
        if: always()
        shell: bash
        env:
          UPLOAD_OUTCOME: ${{ steps.encrypted_artifact.outcome }}
          ARTIFACT_ID: ${{ steps.encrypted_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.encrypted_artifact.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          set +x
          python3 scripts/ci/package-b-confidential-repro.py \
            --verify-upload \
            --upload-outcome "$UPLOAD_OUTCOME" \
            --artifact-id "$ARTIFACT_ID" \
            --artifact-digest "$ARTIFACT_DIGEST"

      - name: Remove owned age files after artifact handling
        if: always()
        shell: bash
        env:
          PHP_VERSION: ${{ matrix.php }}
          ARTIFACT_OWNED: ${{ steps.targeted.outputs.artifact_owned || 'false' }}
        run: |
          set -u
          set +x
          failed=0
          case "$ARTIFACT_OWNED" in
            true|false) ;;
            *) echo 'AGE_TEMP_CLEANUP=INVALID_OWNERSHIP_STATE'; failed=1 ;;
          esac
          root_valid=0
          age_root="${WPCG_AGE_TEMP_DIR:-}"
          if ! python3 scripts/ci/package-b-confidential-repro.py \
            --validate-age-temp-dir --age-temp-dir "$age_root" --runner-temp "$RUNNER_TEMP" >/dev/null; then
            echo 'AGE_TEMP_CLEANUP=INVALID_OR_MISSING_ROOT'
            failed=1
          else
            root_valid=1
          fi
          archive="$age_root/age-v1.3.2-linux-amd64.tar.gz"
          encrypted="$RUNNER_TEMP/wpcg-package-b-confidential-${PHP_VERSION}.age"
          age_binary="$age_root/extract/age/age"
          age_dir="$age_root/extract/age"
          extract_root="$age_root/extract"
          if [ "$root_valid" -eq 1 ]; then
            for path in "$archive" "$age_binary"; do
              if { [ -e "$path" ] || [ -L "$path" ]; } && ! rm -- "$path"; then failed=1; fi
            done
            for path in "$age_dir" "$extract_root" "$age_root"; do
              if { [ -d "$path" ] || [ -L "$path" ]; } && ! rmdir -- "$path"; then failed=1; fi
              if [ -e "$path" ] || [ -L "$path" ]; then failed=1; fi
            done
          fi
          if [ "$ARTIFACT_OWNED" = 'true' ]; then
            if { [ -e "$encrypted" ] || [ -L "$encrypted" ]; } && ! rm -- "$encrypted"; then failed=1; fi
            if [ -e "$encrypted" ] || [ -L "$encrypted" ]; then failed=1; fi
          fi
          if [ "$failed" -ne 0 ]; then
            echo 'AGE_TEMP_CLEANUP=FAILED'
            exit 1
          fi
          echo 'AGE_TEMP_CLEANUP=PASS'
