name: Package B guard predicate diagnostic (one-shot)

on:
  push:
    branches:
      - codex/package-b-guard-predicate-diagnostics-20261102
    paths:
      - '.github/workflows/package-b-guard-predicate-diagnostic.yml'
      - 'app/Deployment/Phase2B/TransitionLeaseStore.php'
      - 'app/Models/TransitionLeaseState.php'
      - 'scripts/ci/package-b-guard-predicate-diagnostic.py'
      - 'tests/Feature/Deployment/Phase2B/TransitionLeasePersistenceTest.php'

permissions:
  contents: read

jobs:
  target:
    name: Guard predicate diagnostic (PHP ${{ matrix.php }}, isolated MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: caregrid_guard_diagnostic
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install locked Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Download and verify age v1.3.2
        id: age
        shell: bash
        run: |
          set -euo pipefail
          age_root="$(mktemp -d "$RUNNER_TEMP/wpcg-age-v1.3.2.XXXXXX")"
          if ! printf 'WPCG_AGE_TEMP_DIR=%s\n' "$age_root" >> "$GITHUB_ENV"; then
            if rmdir "$age_root" && [[ ! -e "$age_root" && ! -L "$age_root" ]]; then
              echo 'AGE_SETUP_CLEANUP=PASS'
            else
              echo 'AGE_SETUP_CLEANUP=FAILED'
            fi
            exit 1
          fi
          chmod 700 "$age_root"
          archive="$age_root/age-v1.3.2-linux-amd64.tar.gz"
          mkdir -m 700 "$age_root/extract"
          curl --fail --show-error --location --max-filesize 20000000 --connect-timeout 15 --max-time 60 \
            --output "$archive" \
            'https://github.com/FiloSottile/age/releases/download/v1.3.2/age-v1.3.2-linux-amd64.tar.gz' \
            >/dev/null 2>&1
          printf '%s  %s\n' 'cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10' "$archive" | sha256sum --check --status
          tar -xzf "$archive" -C "$age_root/extract" age/age
          age_bin="$age_root/extract/age/age"
          test -f "$age_bin" && test ! -L "$age_bin"
          chmod 700 "$age_bin"
          version="$("$age_bin" --version 2>/dev/null)"
          if [[ "$version" != 'v1.3.2' ]]; then
            echo 'AGE_BINARY_VERSION=REJECTED'
            exit 1
          fi
          printf 'WPCG_AGE_BIN=%s\n' "$age_bin" >> "$GITHUB_ENV"
          echo 'AGE_BINARY=VERIFIED'

      - name: Validate diagnostic helper without PHPUnit execution
        run: |
          python3 -c "import ast, pathlib; ast.parse(pathlib.Path('scripts/ci/package-b-guard-predicate-diagnostic.py').read_text(encoding='utf-8'))"
          python3 scripts/ci/package-b-guard-predicate-diagnostic.py --self-test

      - name: Provision disposable test database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --execute="SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE IF NOT EXISTS caregrid_guard_diagnostic CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'caregrid_guard_ci'@'%' IDENTIFIED BY '$db_password'; GRANT ALL PRIVILEGES ON caregrid_guard_diagnostic.* TO 'caregrid_guard_ci'@'%';"
          trust="$(MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --batch --skip-column-names --execute="SELECT @@GLOBAL.log_bin_trust_function_creators;")"
          if [[ "$trust" != "1" ]]; then
            echo 'Disposable MySQL trust-function setting was not confirmed.' >&2
            exit 1
          fi
          credential_file="$RUNNER_TEMP/wpcg-package-b-guard-db-credential"
          if [[ -e "$credential_file" || -L "$credential_file" ]]; then
            echo 'DB_CREDENTIAL_FILE=PATH_OCCUPIED'
            exit 1
          fi
          umask 077
          printf 'WPCG_DB_CREDENTIAL_OWNED=true\n' >> "$GITHUB_ENV"
          printf '%s' "$db_password" > "$credential_file"
          chmod 600 "$credential_file"
          if [[ "$(stat -c '%a' "$credential_file")" != '600' ]]; then
            echo 'DB_CREDENTIAL_FILE=PERMISSIONS_INVALID'
            exit 1
          fi

      - name: Run exactly one selected PHPUnit test
        id: diagnostic
        shell: bash
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: caregrid_guard_diagnostic
          DB_USERNAME: caregrid_guard_ci
          DB_URL: ''
          CAREGRID_EXPECTED_DATABASE_DRIVER: mysql
          CAREGRID_EXPECTED_DATABASE_VERSION: '8.4'
        run: |
          set -euo pipefail
          credential_file="$RUNNER_TEMP/wpcg-package-b-guard-db-credential"
          test -f "$credential_file" && test ! -L "$credential_file"
          [[ "$(stat -c '%a' "$credential_file")" == '600' ]]
          db_password="$(cat "$credential_file")"
          [[ "$db_password" =~ ^[0-9a-f]{64}$ ]]
          echo "::add-mask::$db_password"
          DB_PASSWORD="$db_password" python3 scripts/ci/package-b-guard-predicate-diagnostic.py --run --php-version '${{ matrix.php }}' --age-bin "$WPCG_AGE_BIN"
          unset db_password

      - name: Upload encrypted PHPUnit evidence only
        id: artifact
        if: ${{ always() && steps.diagnostic.outputs.artifact_created == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package-b-guard-diagnostic-php-${{ matrix.php }}
          path: ${{ runner.temp }}/wpcg-package-b-guard-${{ matrix.php }}.age
          if-no-files-found: error
          retention-days: 1

      - name: Verify encrypted artifact upload receipt
        if: ${{ always() && steps.diagnostic.outputs.artifact_owned == 'true' }}
        env:
          UPLOAD_OUTCOME: ${{ steps.artifact.outcome }}
          ARTIFACT_ID: ${{ steps.artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        shell: bash
        run: python3 scripts/ci/package-b-guard-predicate-diagnostic.py --verify-upload --php-version '${{ matrix.php }}' --upload-outcome "$UPLOAD_OUTCOME" --artifact-id "$ARTIFACT_ID" --artifact-digest "$ARTIFACT_DIGEST"

      - name: Remove temporary diagnostic and age files
        if: ${{ always() }}
        env:
          ARTIFACT_OWNED: ${{ steps.diagnostic.outputs.artifact_owned }}
        shell: bash
        run: python3 scripts/ci/package-b-guard-predicate-diagnostic.py --cleanup-age --php-version '${{ matrix.php }}' --age-root "${WPCG_AGE_TEMP_DIR:-}" --artifact-owned "${ARTIFACT_OWNED:-}"
