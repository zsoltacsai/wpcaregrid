# Continuous integration on Linux (docs/DEPLOYMENT.md, docs/RELEASE_CHECKLIST.md).
#
# Every job must pass. Missing test services fail the run instead of being
# skipped (CAREGRID_TEST_REQUIRE_SERVICES, WP_CAREGRID_TEST_STRICT,
# --fail-on-skipped). Nothing is deployed from here.
name: CI

on:
  push:
    branches:
      - claude/ecstatic-wozniak-oemyuf
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      connector_release_base:
        description: Base revision for Connector release validation when dispatching a maintenance branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath

jobs:
  quality:
    name: Quality (lint, style, dependencies, build, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Tracked secret-path policy tests
        run: python3 scripts/tests/repository-secret-path-policy-test.py

      - name: Staging diagnostics output and policy tests
        run: |
          python3 scripts/tests/staging-diagnostics-output-test.py
          python3 scripts/tests/staging-diagnostics-policy-test.py
          python3 scripts/tests/staging-diagnostics-provisioning-test.py
          python3 scripts/tests/staging-diagnostics-package-preparation-test.py
          python3 scripts/tests/staging-diagnostics-bootstrap-test.py
          python3 -m py_compile scripts/staging-diagnostics/provisioning/bootstrap.py scripts/staging-diagnostics/provisioning/provision.py scripts/staging-diagnostics/provisioning/verify.py scripts/staging-diagnostics/provisioning/rollback.py
          php scripts/tests/staging-diagnostics-parser-test.php
          php -l scripts/staging-diagnostics/read-m12-cache.php
          bash -n scripts/staging-diagnostics/dispatch.sh scripts/staging-diagnostics/run-m12-readback.sh scripts/staging-diagnostics/provisioning/activation-check.sh scripts/staging-diagnostics/provisioning/diagnostics-shell.sh scripts/staging-diagnostics/provisioning/run-m12-readback.sh scripts/staging-diagnostics/provisioning/prepare-package.sh
          bash -n scripts/tests/staging-diagnostics-linux-integration-test.sh

      - name: Debian 12 staging diagnostics integration
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" debian:12-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
          bash -lc "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq acl openssh-server sudo php-cli python3 git && cd /workspace && bash scripts/tests/staging-diagnostics-linux-integration-test.sh"

      - name: No local files, databases or keys in the repository
        run: python3 scripts/tests/repository-secret-path-policy.py

      - name: CI supply-chain policy
        run: python3 scripts/tests/ci-supply-chain-policy-test.py

      - name: Gitleaks archive verifier tests
        run: python3 scripts/tests/gitleaks-archive-test.py

      - name: Validate composer files
        run: |
          composer validate --strict --no-check-publish
          composer validate --strict --no-check-publish --working-dir=wordpress

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax (application, tests, connector)
        run: |
          find app bootstrap config database lang routes tests scripts/e2e wordpress/wp-caregrid-connector wordpress/tests -name '*.php' -print0 \
            | xargs -0 -n 50 -P 4 sh -c 'for f; do php -l "$f" > /dev/null || exit 255; done' sh

      - name: M8 fixture fingerprint contract
        run: php scripts/e2e/test-fingerprint-v2.php

      - name: Staging deploy privilege allowlist policy
        run: python3 scripts/tests/deploy-privilege-policy-test.py

      - name: Exact-SHA release CI authorization policy
        run: python3 scripts/tests/verify-release-ci-test.py

      - name: Deployment receipt provenance policy
        run: python3 scripts/tests/deployment-receipt-test.py

      - name: Connector package version and source consistency
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_BASE: ${{ inputs.connector_release_base }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_BASE" ]]; then
            if [[ ! "$DISPATCH_BASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Connector release base must be an exact 40-character commit SHA." >&2
              exit 1
            fi
            base="$DISPATCH_BASE"
            if [[ "$(git cat-file -t "$base" 2>/dev/null || true)" != "commit" ]]; then
              echo "Connector release base does not identify a local commit." >&2
              exit 1
            fi
          else
            base="$EVENT_BASE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git merge-base origin/main HEAD)"; fi
          fi
          php scripts/check-connector-release.php "$base"
          bash scripts/tests/connector-release-version-gate-test.sh

      - name: Code style (Pint)
        run: vendor/bin/pint --test -v

      - name: PHP dependency advisories (application and connector test harness)
        run: |
          composer audit --locked --no-interaction
          composer audit --locked --no-interaction --working-dir=wordpress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: JavaScript contracts and M147-A safety tests (fake sinks; no network)
        run: npm test

      - name: npm advisories (high and critical)
        run: npm audit --audit-level=high

      - name: Secret scan (Gitleaks 8.30.0, verified archive, full history)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --show-error --location --max-filesize 20000000 --connect-timeout 15 --max-time 60 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz"
          python3 scripts/verify-gitleaks-archive.py "$archive" "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" detect --source=. --config=.gitleaks.toml --redact --no-banner --verbose

  server:
    name: Server tests (PHP 8.4, ${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql, mariadb]
    services:
      mysql:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: caregrid_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # A missing S3 or SFTP test service fails the run (tests/Support/StorageServers.php).
      CAREGRID_TEST_REQUIRE_SERVICES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Database for this job
        env:
          # Disposable test-service credential, scoped to database provisioning.
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          if [ "${{ matrix.database }}" = "mysql" ]; then
            set -euo pipefail
            db_password="$(openssl rand -hex 32)"
            echo "::add-mask::$db_password"
            MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --execute="CREATE DATABASE IF NOT EXISTS caregrid_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'caregrid_ci'@'%' IDENTIFIED BY '${db_password}'; GRANT ALL PRIVILEGES ON caregrid_test.* TO 'caregrid_ci'@'%';"
            {
              echo "DB_CONNECTION=mysql"
              echo "DB_HOST=127.0.0.1"
              echo "DB_PORT=3306"
              echo "DB_DATABASE=caregrid_test"
              echo "DB_USERNAME=caregrid_ci"
              echo "DB_PASSWORD=$db_password"
              echo "DB_URL="
              echo "M9_MYSQL_VERIFY_PASSWORD=$MYSQL_ROOT_PASSWORD"
            } >> "$GITHUB_ENV"
          fi

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Views reference the Vite manifest.
      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: S3-compatible test service (moto)
        run: |
          pipx install 'moto[server]==5.2.4'
          # pipx links apps into its own bin directory (/opt/pipx_bin on GitHub runners).
          bin="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/moto_server" --help > /dev/null

      - name: SFTP test service (OpenSSH, dedicated user, key authentication, pinned host key)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl openssh-server
          sudo useradd --create-home --shell /bin/bash caregrid-sftp
          # No password, but not a locked account: sshd refuses keys for locked accounts without PAM.
          sudo usermod -p '*' caregrid-sftp
          dir="$RUNNER_TEMP/sftp"; mkdir -p "$dir"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/client"
          sudo install -d -m 700 -o caregrid-sftp -g caregrid-sftp /home/caregrid-sftp/.ssh /home/caregrid-sftp/storage
          sudo install -m 600 -o caregrid-sftp -g caregrid-sftp "$dir/client.pub" /home/caregrid-sftp/.ssh/authorized_keys
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/caregrid_test_host_ed25519
          cp /etc/ssh/caregrid_test_host_ed25519.pub "$dir/host.pub"
          printf '%s\n' \
            'Port 2222' 'ListenAddress 127.0.0.1' 'HostKey /etc/ssh/caregrid_test_host_ed25519' \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' 'PubkeyAuthentication yes' 'UsePAM no' \
            'AllowUsers caregrid-sftp' 'Subsystem sftp internal-sftp' 'PidFile /run/caregrid-test-sshd.pid' \
            | sudo tee /etc/ssh/caregrid_test_sshd_config > /dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f /etc/ssh/caregrid_test_sshd_config
          sudo /usr/sbin/sshd -f /etc/ssh/caregrid_test_sshd_config
          {
            echo "CAREGRID_TEST_SFTP_HOST=127.0.0.1"
            echo "CAREGRID_TEST_SFTP_PORT=2222"
            echo "CAREGRID_TEST_SFTP_USER=caregrid-sftp"
            echo "CAREGRID_TEST_SFTP_KEY=$dir/client"
            echo "CAREGRID_TEST_SFTP_HOST_KEY=$dir/host.pub"
            echo "CAREGRID_TEST_SFTP_ROOT=/home/caregrid-sftp/storage"
          } >> "$GITHUB_ENV"

      - name: Application environment
        run: |
          cp .env.example .env
          # CI has no persistent scheduler cache; keep health checks independent
          # from the disposable DB cache table after test transactions migrate.
          echo "CACHE_STORE=array" >> "$GITHUB_ENV"
          php artisan key:generate --force
          if [ "${{ matrix.database }}" = "sqlite" ]; then
            touch database/ci.sqlite
            echo "DB_DATABASE=$PWD/database/ci.sqlite" >> "$GITHUB_ENV"
          fi

      - name: Migrations from an empty database, full rollback, and again
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan migrate:status | tee /dev/stderr | grep -q Pending && exit 1 || true

      - name: Production caches build (config, routes, views, events)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize:clear

      - name: Test suite
        # Strictly fail if the complete MySQL suite skips anything. The sqlite
        # matrix intentionally skips database-engine-specific contention tests;
        # those execute in the dedicated strict MySQL gate below.
        run: |
          if [ "${{ matrix.database }}" = "sqlite" ]; then unset DB_DATABASE; fi
          if [ "${{ matrix.database }}" = "mysql" ]; then
            vendor/bin/phpunit -c phpunit.xml --fail-on-skipped --display-skipped --display-warnings
          else
            vendor/bin/phpunit -c phpunit.xml --display-skipped --display-warnings
          fi

      - name: Required MySQL process-concurrency gate
        if: matrix.database == 'mysql'
        run: |
          set -euo pipefail
          for test in \
            tests/Feature/BillingIdentityConcurrencyTest.php \
            tests/Feature/ViesReviewConcurrencyTest.php \
            tests/Feature/PromotionReservationConcurrencyTest.php \
            tests/Feature/StripeSubscriptionConcurrencyTest.php \
            tests/Feature/InvoiceIntentConcurrencyTest.php \
            tests/Feature/InvoiceIssuanceConcurrencyTest.php \
            tests/Feature/Privacy/PrivacyRequestConcurrencyTest.php \
            tests/Feature/SyntheticSzamlazzTestConcurrencyTest.php \
            tests/Feature/Monitoring/MonitoringEngineConcurrencyTest.php; do
            vendor/bin/phpunit -c phpunit.xml --fail-on-skipped --display-skipped --display-warnings "$test"
          done

      - name: Restore disposable schema for post-test checks
        run: php artisan migrate:fresh --force

      - name: System check (runs, never prints secrets)
        run: php artisan system:check

      - name: HTTP smoke test against a running server (production caches)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8000/up > /dev/null && break; sleep 0.2; done
          php tests/smoke/http-smoke.php http://localhost:8000
          php artisan optimize:clear

  wordpress:
    name: Connector tests in WordPress (PHP ${{ matrix.php }}, ${{ matrix.database }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { database: sqlite, php: '8.4' }
          - { database: mysql, php: '8.4' }
          - { database: mariadb, php: '8.4' }
    services:
      mysql:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Symlink containment and permission tests must run here, never be skipped.
      WP_CAREGRID_TEST_STRICT: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install WordPress and test dependencies
        working-directory: wordpress
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build the reviewed Connector release artifact
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan connector:package
          echo "WP_CAREGRID_CONNECTOR_PACKAGE=$GITHUB_WORKSPACE/storage/app/private/connector/wp-caregrid-connector-$(php -r 'echo json_decode(file_get_contents("wordpress/wp-caregrid-connector/release.json"), true)["version"];').zip" >> "$GITHUB_ENV"

      - name: Connector tests (real WordPress)
        working-directory: wordpress
        run: |
          if [ "${{ matrix.database }}" != "sqlite" ]; then
            export WP_CAREGRID_TEST_MYSQL='root:ci-root-password@127.0.0.1/wordpress'
          fi
          vendor/bin/phpunit --display-skipped
