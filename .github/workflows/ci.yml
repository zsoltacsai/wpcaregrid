              STRIPE_MODE) export "$stripe_variable=test" ;;
              *) export "$stripe_variable=" ;;
            esac
            stripe_variable_count=$((stripe_variable_count + 1))
          done < <(sed -nE 's/^(STRIPE_[A-Z0-9_]+)=.*/\1/p' .env.example)
          [[ "$stripe_variable_count" -gt 0 ]]

          php artisan optimize:clear
          php artisan config:cache

          php <<'PHP'
          <?php
          require __DIR__.'/vendor/autoload.php';
          $app = require __DIR__.'/bootstrap/app.php';
          $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();

          $expected = [
              'app.env' => 'testing',
              'app.deployment_environment' => 'testing',
              'app.url' => 'http://127.0.0.1:8001',
              'app.debug' => false,
              'marketing_release.profile' => 'marketing_only',
              'marketing_release.enforcement_mode' => 'testing',
              'marketing_release.test_app_environment' => 'testing',
              'marketing_release.test_deployment_environment' => 'testing',
              'mail.default' => 'array',
              'queue.default' => 'sync',
              'session.driver' => 'array',
              'services.stripe.allow_live_mode' => false,
              'services.stripe.mode' => 'test',
          ];

          foreach ($expected as $key => $value) {
              if (config($key) !== $value) {
                  fwrite(STDERR, "Application-mode smoke cached configuration mismatch: {$key}\n");
                  exit(1);
              }
          }

          foreach (['wordpress', 'woocommerce'] as $product) {
              if (! in_array(config("pricing.stripe_products.{$product}"), [null, ''], true)) {
                  fwrite(STDERR, "Application-mode smoke cached Stripe product is configured.\n");
                  exit(1);
              }
          }

          foreach (['key', 'secret', 'webhook_secret', 'payment_method_portal_configuration'] as $stripeSetting) {
              if (! in_array(config("services.stripe.{$stripeSetting}"), [null, ''], true)) {
                  fwrite(STDERR, "Application-mode smoke cached Stripe credential/configuration is present.\n");
                  exit(1);
              }
          }

          foreach (config('pricing.prices', []) as $price) {
              if (! in_array($price['stripe_price_id'] ?? null, [null, ''], true)) {
                  fwrite(STDERR, "Application-mode smoke cached Stripe price is configured.\n");
                  exit(1);
              }
          }

          echo "Application-mode smoke cache identity and disabled billing configuration verified.\n";
          PHP

          php -S 127.0.0.1:8001 -t public public/index.php > "$RUNNER_TEMP/application-smoke-server.log" 2>&1 &
          server_pid=$!

          ready=0
          for attempt in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:8001/up; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 0.2
          done
          if [[ "$ready" != 1 ]]; then
            echo "Application-mode loopback server did not become ready." >&2
            exit 1
          fi

          php tests/smoke/http-smoke.php http://127.0.0.1:8001 --expect=application

  php85_fpm_compat:
    name: Isolated PHP 8.5 FPM compatibility
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      PHP_FPM_BASE: php:8.5.12-fpm@sha256:8b4b4a764f7985137b13e4cb49dd59e967d9daa7946a731f9d06e31e748e39bb
      PHP_EXTENSIONS: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5.12'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Install reviewed Composer dependencies before network isolation
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Verify FPM lane negative isolation policies
        run: python3 scripts/tests/php-fpm/policy-test.py

      - name: Build then run sealed PHP-FPM compatibility container
        run: bash scripts/tests/php-fpm/run-ci.sh

  sqlite_regressions:
    name: Server SQLite regression gate (PHP 8.4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/ci-sqlite-regressions.sqlite
      DB_URL: ''
      CACHE_STORE: array
      CAREGRID_EXPECTED_DATABASE_DRIVER: sqlite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, fileinfo, openssl, curl, posix, pcntl, bcmath
          coverage: none
          tools: composer:v2

      - name: Application environment
        run: |
          cp .env.example .env
          touch database/ci-sqlite-regressions.sqlite

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Initialize disposable SQLite database
        run: |
          php artisan key:generate --force
          php artisan migrate --force

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Frontend build for rendered feature tests
        run: |
          npm ci
          npm run build

      - name: Verify the actual Laravel SQLite connection
        run: php scripts/tests/assert-ci-sqlite-driver.php

      - name: Targeted fast SQLite regressions (no S3/SFTP services)
        run: |
          set -euo pipefail
          vendor/bin/phpunit -c phpunit.xml --fail-on-skipped --display-skipped --display-warnings tests/Unit
          for test in \
            tests/Feature/AuthorizationMatrixTest.php \
            tests/Feature/Account/AuthenticationTest.php \
            tests/Feature/Account/AuthorizationTest.php \
            tests/Feature/Account/CustomerAreaTest.php \
            tests/Feature/Account/OnboardingTest.php \
            tests/Feature/CustomerLocalizationTest.php \
            tests/Feature/LocalizedMarketingRoutesTest.php; do
            vendor/bin/phpunit -c phpunit.xml --fail-on-skipped --display-skipped --display-warnings "$test"
          done

  wordpress:
    name: ${{ matrix.legacy_check_name || format('Connector tests (PHP {0}, WordPress {1}, {2})', matrix.php, matrix.wordpress, matrix.database) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        wordpress: ['6.8', '7.1']
        database: [mysql57, mysql80, mysql, mariadb]
        include:
          # Preserve the protected primary branch's seven required check
          # contexts while exercising the same PHP 8.4 / WP 7.1 fixtures.
          - { php: '8.4', wordpress: '7.1', database: sqlite, legacy_check_name: 'Connector tests in WordPress (PHP 8.4, sqlite)' }
          - { php: '8.4', wordpress: '7.1', database: mysql, legacy_check_name: 'Connector tests in WordPress (PHP 8.4, mysql)' }
          - { php: '8.4', wordpress: '7.1', database: mariadb, legacy_check_name: 'Connector tests in WordPress (PHP 8.4, mariadb)' }
    services:
      mysql:
        image: ${{ matrix.database == 'mariadb' && 'mariadb:10.11' || matrix.database == 'mysql57' && 'mysql:5.7' || matrix.database == 'mysql80' && 'mysql:8.0' || 'mysql:8.4' }}
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Symlink containment and permission tests must run here, never be skipped.
      WP_CAREGRID_TEST_STRICT: '1'
      WP_CAREGRID_EXPECTED_PHP_BRANCH: ${{ matrix.php }}
      WP_CAREGRID_EXPECTED_WORDPRESS_BRANCH: ${{ matrix.wordpress }}
      WP_CAREGRID_EXPECTED_DATABASE: ${{ (matrix.database == 'mysql57' || matrix.database == 'mysql80') && 'mysql' || matrix.database }}
      WP_CAREGRID_EXPECTED_DATABASE_BRANCH: ${{ matrix.database == 'mysql57' && '5.7' || matrix.database == 'mysql80' && '8.0' || matrix.database == 'mysql' && '8.4' || matrix.database == 'mariadb' && '10.11' || 'sqlite' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Build the release artifact under the separately pinned Laravel/server
      # runtime. Connector customer-host PHP is selected only for its tests.
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Build the reviewed Connector release artifact
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan connector:package
          echo "WP_CAREGRID_CONNECTOR_PACKAGE=$GITHUB_WORKSPACE/storage/app/private/connector/wp-caregrid-connector-$(php -r 'echo json_decode(file_get_contents("wordpress/wp-caregrid-connector/release.json"), true)["version"];').zip" >> "$GITHUB_ENV"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Resolve test tools for the customer PHP branch
        working-directory: wordpress
        env:
          PHPUNIT_CONSTRAINT: ${{ matrix.php == '8.2' && '^11.5' || matrix.php == '8.3' && '^12.0' || '^13.4' }}
          WORDPRESS_CONSTRAINT: ${{ format('~{0}.0', matrix.wordpress) }}
        run: |
          set -euo pipefail
          composer update phpunit/phpunit --with "phpunit/phpunit:$PHPUNIT_CONSTRAINT" --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer update johnpbloch/wordpress-core --with "johnpbloch/wordpress-core:$WORDPRESS_CONSTRAINT" --with-all-dependencies --no-interaction --prefer-dist --no-progress
          composer install --no-interaction --prefer-dist --no-progress

      - name: Connector tests (real WordPress)
        working-directory: wordpress
        run: |
          if [ "${{ matrix.database }}" != "sqlite" ]; then
            export WP_CAREGRID_TEST_MYSQL='root:ci-root-password@127.0.0.1/wordpress'
          fi
          vendor/bin/phpunit --display-skipped
