          target_method = "TransitionPersistenceBridgeTest::test_typed_rpc_cas_is_atomic_and_exact_replay_returns_its_receipt"
          target_name = None
          last_passed = None
          target_active = False
          target_start_offset = None
          active_transaction_seen = False
          observer_lock = threading.Lock()
          first_snapshot_done = threading.Event()
          second_snapshot_claimed = False
          second_snapshot_timer = None
          second_snapshot_delay_seconds = 20
          active_tests = {}
          test_start_sequence = 0
          last_finished_test_name = None
          no_progress_snapshot_claimed = False
          watchdog_shutdown = False
          test_stall_timeout_seconds = 90
          watchdog_condition = threading.Condition(observer_lock)

          def safe_test_name(value):
              return "".join(char if char.isalnum() or char in "_.$:\\" else "?" for char in value)[:240]

          safe_rpc_diagnostic = re.compile(
              r"(?:phase=preflight; probe=(?:php_version|cache_setup|artisan_list|command_help); state=(?:timeout|failed|command_missing)(?:; exit_code=-?\d+)?|"
              r"phase=preflight; probe=artisan_version; state=timeout(?:; exit_code=-?\d+)?|"
              r"phase=preflight; probe=artisan_version; state=failed(?:; exit_code=-?\d+)?(?:; cause=(?:CACHE_MANIFEST_WRITE|CACHE_MANIFEST_READ|CONFIG_CACHE_LOAD|PHP_AUTOLOAD_OR_BOOTSTRAP|DB_OR_PROVIDER_BOOT|CONSOLE_BOOTSTRAP|APP_PROVIDER_BOOT|SQLITE_OR_PDO_BOOT|SYMFONY_CONSOLE_BOOT_OR_REGISTRATION|PHP_PARSE_OR_RUNTIME_FATAL|EMPTY_DIAGNOSTIC|INPUT_PARENT_TRAVERSE_DENIED|INPUT_SCRIPT_MISSING|INPUT_SCRIPT_NOT_REGULAR|INPUT_SCRIPT_UNREADABLE|INPUT_SCRIPT_READABLE|INPUT_ACCESS_CHECK_FAILED|PHP_STARTUP|APP_KEY_CONFIG|PHP_WARNING|OTHER_EXCEPTION|OTHER_NONEMPTY_OUTPUT|UNCLASSIFIED))?|"
              r"phase=source_copy; state=(?:failed|timeout)|phase=socket_setup; state=failed|phase=child_start; state=failed|phase=peer_credentials; state=(?:invalid|mismatch)|phase=request; state=send_failed|phase=response; state=(?:framing_invalid|receive_failed|decode_failed|envelope_invalid|canonical_invalid|identity_mismatch|tuple_mismatch)|phase=root_helper; state=(?:failed|spawn_failed|script_write_failed|script_mode_failed|request_encode_failed|temp_setup_failed|fixture_permissions_failed)|phase=accept; state=failed|phase=child; state=wait_failed|phase=progress; marker=(?:helper_begin|source_copy_begin|source_copy_end|preflight_php_version_begin|preflight_php_version_end|preflight_artisan_version_begin|preflight_artisan_version_end|preflight_cache_lock_begin|preflight_cache_lock_end|preflight_artisan_list_begin|preflight_artisan_list_end|preflight_command_help_begin|preflight_command_help_end|socket_setup_begin|socket_setup_end|child_spawn_begin|child_spawn_end|socket_accept_begin|socket_accept_end|peer_credentials_begin|peer_credentials_end|request_send_begin|request_send_end|response_read_begin|response_read_end|child_wait_begin|child_wait_end|cleanup_begin|preflight_reap_begin|preflight_reap_end|child_reap_begin|child_reap_end|cache_cleanup_begin|cache_cleanup_end|cleanup_end)|phase=child_marker; marker=(?:handler_entry|unprivileged_identity_pass|socket_option_pass|connect_attempt|connect_success|no_marker)|"
              r"phase=(?:accept_timeout|response_timeout|child_wait_timeout); child_state=running|phase=wrapper_signal; state=deferred|phase=wrapper_signal; child_state=(?:not_started|running|exited)(?:; exit_code=-?\d+)?; last_marker=(?:helper_begin|source_copy_begin|source_copy_end|preflight_php_version_begin|preflight_php_version_end|preflight_artisan_version_begin|preflight_artisan_version_end|preflight_cache_lock_begin|preflight_cache_lock_end|preflight_artisan_list_begin|preflight_artisan_list_end|preflight_command_help_begin|preflight_command_help_end|socket_setup_begin|socket_setup_end|child_spawn_begin|child_spawn_end|socket_accept_begin|socket_accept_end|peer_credentials_begin|peer_credentials_end|request_send_begin|request_send_end|response_read_begin|response_read_end|child_wait_begin|child_wait_end|cleanup_begin|preflight_reap_begin|preflight_reap_end|child_reap_begin|child_reap_end|cache_cleanup_begin|cache_cleanup_end|cleanup_end)|"
              r"phase=(?:accept|response|child); child_state=exited; exit_code=-?\d+|"
              r"phase=cleanup; component=(?:child_reap|preflight_reap|preflight_cache|application_source|temporary_root|socket_cleanup); state=unconfirmed|"
              r"phase=wrapper_timeout; cleanup_state=(?:confirmed|unconfirmed))"
          )
          ansi_control = re.compile(r"\x1B(?:[@-Z\\-_]|\[[0-?]*[ -/]*[@-~])")

          def emit_safe_rpc_diagnostic():
              latest_safe_diagnostic = None
              wrapper_signal_diagnostic = None
              wrapper_timeout_diagnostic = None
              latest_progress_diagnostic = None
              cleanup_diagnostics = set()
              try:
                  with open(log_path, "r", encoding="utf-8", errors="replace") as recorded_output:
                      for line in recorded_output:
                          candidate = ansi_control.sub("", line).strip()
                          for match in safe_rpc_diagnostic.finditer(candidate):
                              diagnostic = match.group(0)
                              if diagnostic.startswith("phase=cleanup; component="):
                                  cleanup_diagnostics.add(diagnostic)
                              elif diagnostic.startswith("phase=progress;"):
                                  latest_progress_diagnostic = diagnostic
                              elif diagnostic.startswith("phase=child_marker;"):
                                  continue
                              elif diagnostic.startswith("phase=wrapper_signal;"):
                                  wrapper_signal_diagnostic = diagnostic
                              elif diagnostic.startswith("phase=wrapper_timeout;"):
                                  wrapper_timeout_diagnostic = diagnostic
                              else:
                                  latest_safe_diagnostic = diagnostic
              except OSError:
                  return
              emitted = False
              for diagnostic in (latest_safe_diagnostic, wrapper_signal_diagnostic, wrapper_timeout_diagnostic):
                  if diagnostic is not None:
                      print(diagnostic, flush=True)
                      emitted = True
              for diagnostic in sorted(cleanup_diagnostics):
                  print(diagnostic, flush=True)
                  emitted = True
              if not emitted and latest_progress_diagnostic is not None:
                  print(latest_progress_diagnostic, flush=True)

          def capture_mysql_state(label):
              base = [
                  "mysql", "--protocol=TCP", "--connect-timeout=3",
                  "--host=" + env["DB_HOST"], "--port=" + env["DB_PORT"],
                  "--user=root", "--batch", "--skip-column-names", "--quick",
              ]

              def redact_sql(value):
                  value = re.sub(r"(?is)'(?:''|\\.|[^'\\])*'|\"(?:\"\"|\\.|[^\"\\])*\"", "<literal>", value)
                  value = re.sub(r"(?i)\b(password|token|secret|authorization|api[_-]?key)\b\s*(?:=|:)\s*[^\s,;]+", r"\1=<redacted>", value)
                  value = re.sub(r"(?i)\bhttps?://[^\s]+", "<url>", value)
                  value = re.sub(r"\b(?:0x)?[a-f0-9]{32,}\b", "<hex>", value, flags=re.I)
                  value = re.sub(r"(?<![A-Za-z_])\d+(?![A-Za-z_])", "<n>", value)
                  return value[:240]

              def query(label, sql, render):
                  try:
                      result = subprocess.run(
                          [*base, "--execute", sql], env=env, text=True,
                          stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                          timeout=5, check=False,
                      )
                  except (subprocess.TimeoutExpired, OSError):
                      return label, ["unavailable (bounded query failed)."]
                  if result.returncode != 0:
                      return label, ["unavailable (query failed; details suppressed)."]
                  rows = result.stdout.splitlines()[:100]
                  safe_rows = []
                  for row in rows:
                      try:
                          safe_rows.append(render(row.split("\t")))
                      except Exception:
                          safe_rows.append("<malformed row suppressed>")
                  return label, [f"{len(rows)} row(s).", *safe_rows]

              queries = (
                  ("processlist", "SHOW FULL PROCESSLIST", lambda c: "thread={0} command={1} age_s={2} state={3} sql={4}".format(c[0], c[4], c[5], c[6][:120], redact_sql(c[7])) if len(c) >= 8 else "<malformed row suppressed>"),
                  ("data_locks", "SELECT ENGINE_TRANSACTION_ID, THREAD_ID, EVENT_ID, OBJECT_SCHEMA, OBJECT_NAME, INDEX_NAME, LOCK_TYPE, LOCK_MODE, LOCK_STATUS, IF(LOCK_DATA IS NULL, 'NULL', '<present:redacted>') FROM performance_schema.data_locks WHERE ENGINE = 'INNODB' LIMIT 100", lambda c: "trx={0} thread={1} event={2} object={3}.{4} index={5} type={6} mode={7} status={8} record={9}".format(*c)),
                  ("data_lock_waits", "SELECT w.REQUESTING_ENGINE_TRANSACTION_ID, r.THREAD_ID, r.EVENT_ID, r.OBJECT_SCHEMA, r.OBJECT_NAME, r.INDEX_NAME, r.LOCK_TYPE, r.LOCK_MODE, r.LOCK_STATUS, w.BLOCKING_ENGINE_TRANSACTION_ID, b.THREAD_ID, b.EVENT_ID, b.OBJECT_SCHEMA, b.OBJECT_NAME, b.INDEX_NAME, b.LOCK_TYPE, b.LOCK_MODE, b.LOCK_STATUS FROM performance_schema.data_lock_waits AS w LEFT JOIN performance_schema.data_locks AS r ON r.ENGINE = w.ENGINE AND r.ENGINE_LOCK_ID = w.REQUESTING_ENGINE_LOCK_ID LEFT JOIN performance_schema.data_locks AS b ON b.ENGINE = w.ENGINE AND b.ENGINE_LOCK_ID = w.BLOCKING_ENGINE_LOCK_ID WHERE w.ENGINE = 'INNODB' LIMIT 100", lambda c: "waiting_trx={0} thread={1} event={2} object={3}.{4} index={5} type={6} mode={7} status={8}; blocking_trx={9} thread={10} event={11} object={12}.{13} index={14} type={15} mode={16} status={17}".format(*c)),
                  ("innodb_trx", "SELECT TRX_ID, TRX_STATE, TIMESTAMPDIFF(SECOND, TRX_STARTED, NOW()), TRX_WAIT_STARTED IS NOT NULL, TRX_MYSQL_THREAD_ID, TRX_ROWS_LOCKED, TRX_ROWS_MODIFIED, TRX_QUERY IS NOT NULL FROM information_schema.innodb_trx LIMIT 100", lambda c: "trx={0} state={1} age_s={2} waiting={3} thread={4} rows_locked={5} rows_modified={6} active_sql={7}".format(*c)),
              )
              print(f"MySQL {label} snapshot (root read-only diagnostic):", flush=True)
              active_transaction_count = None
              with ThreadPoolExecutor(max_workers=4) as executor:
                  for title, rows in executor.map(lambda item: query(*item), queries):
                      print(f"{title}: {rows[0]}", flush=True)
                      for row in rows[1:]:
                          print(row, flush=True)
                      if title == "innodb_trx":
                          try:
                              active_transaction_count = int(rows[0].split()[0])
                          except (IndexError, ValueError):
                              active_transaction_count = None
              return active_transaction_count is not None and active_transaction_count > 0

          def test_has_finished_event(raw_name, start_offset):
              try:
                  with open(log_path, "r", encoding="utf-8", errors="replace") as recorded_events:
                      recorded_events.seek(start_offset)
                      for line in recorded_events:
                          match = re.match(r"^(Test [A-Za-z ]+) \(([^)]*)\)$", line.rstrip("\r\n"))
                          if match and match.group(1) == "Test Finished" and match.group(2) == raw_name:
                              return True
              except OSError:
                  return False
              return False

          def no_progress_watchdog():
              global last_finished_test_name, no_progress_snapshot_claimed
              while True:
                  with watchdog_condition:
                      if watchdog_shutdown:
                          return
                      if no_progress_snapshot_claimed or not active_tests:
                          watchdog_condition.wait()
                          continue
                      now = time.monotonic()
                      token, record = min(active_tests.items(), key=lambda item: item[1]["deadline"])
                      remaining = record["deadline"] - now
                      if remaining > 0:
                          watchdog_condition.wait(timeout=remaining)
                          continue

                  if test_has_finished_event(record["raw_name"], record["start_offset"]):
                      with watchdog_condition:
                          current = active_tests.get(token)
                          if current is record:
                              active_tests.pop(token, None)
                              last_finished_test_name = record["name"]
                              watchdog_condition.notify_all()
                      continue

                  with watchdog_condition:
                      current = active_tests.get(token)
                      if watchdog_shutdown:
                          return
                      if current is not record or no_progress_snapshot_claimed:
                          continue
                      no_progress_snapshot_claimed = True
                      elapsed_seconds = max(0.0, time.monotonic() - record["started_at"])
                      last_finished = last_finished_test_name
                      active_name = record["name"]

                  print(
                      "PHPUnit no-progress watchdog: active_test={0}; last_test_finished={1}; elapsed_s={2:.1f}; capturing one bounded snapshot.".format(
                          active_name, last_finished or "none observed", elapsed_seconds,
                      ),
                      flush=True,
                  )
                  capture_mysql_state("PHPUnit no-progress after {0}s".format(int(elapsed_seconds)))

          def arm_test_watchdog(raw_name, safe_name, start_offset):
              global test_start_sequence
              started_at = time.monotonic()
              with watchdog_condition:
                  test_start_sequence += 1
                  token = test_start_sequence
                  active_tests[token] = {
                      "raw_name": raw_name,
                      "name": safe_name,
                      "started_at": started_at,
                      "deadline": started_at + test_stall_timeout_seconds,
                      "start_offset": start_offset,
                  }
                  watchdog_condition.notify_all()
              return token

          def finish_test_watchdog(raw_name, safe_name):
              global last_finished_test_name
              with watchdog_condition:
                  for token, record in list(active_tests.items()):
                      if record["raw_name"] == raw_name:
                          active_tests.pop(token, None)
                  last_finished_test_name = safe_name
                  watchdog_condition.notify_all()

          def target_has_finished_event():
              if target_start_offset is None or target_name is None:
                  return False
              try:
                  with open(log_path, "r", encoding="utf-8", errors="replace") as recorded_events:
                      recorded_events.seek(target_start_offset)
                      for line in recorded_events:
                          match = re.match(r"^(Test [A-Za-z ]+) \(([^)]*)\)$", line.rstrip("\r\n"))
                          if match and safe_test_name(match.group(2)) == target_name and match.group(1) == "Test Finished":
                              return True
              except OSError:
                  return False
              return False

          def take_second_snapshot_after_bounded_interval():
              global second_snapshot_claimed, target_active
              if not first_snapshot_done.wait(timeout=10):
                  print("Second MySQL snapshot not taken: initial bounded snapshot did not finish.", file=sys.stderr, flush=True)
                  return
              with observer_lock:
                  should_snapshot = target_active or active_transaction_seen
                  transaction_trigger = active_transaction_seen
                  current_target_name = target_name
                  suite_process = suite
              if not should_snapshot:
                  print("No second MySQL snapshot: target test completed and initial snapshot saw no active transaction.", flush=True)
                  return
              if not transaction_trigger and (suite_process.poll() is not None or target_has_finished_event()):
                  with observer_lock:
                      target_active = False
                  print("No second MySQL snapshot: target test completed before the bounded checkpoint.", flush=True)
                  return
              with observer_lock:
                  if second_snapshot_claimed:
                      return
                  second_snapshot_claimed = True
              reason = "active InnoDB transaction was present initially" if transaction_trigger else "target test remained active"
              print(f"Taking second MySQL snapshot after {second_snapshot_delay_seconds}s; reason: {reason}; test: {current_target_name}.", flush=True)
              capture_mysql_state(f"after {second_snapshot_delay_seconds}s bounded interval")

          def start_second_snapshot_timer():
              global second_snapshot_timer
              second_snapshot_timer = threading.Timer(second_snapshot_delay_seconds, take_second_snapshot_after_bounded_interval)
              second_snapshot_timer.daemon = False
              second_snapshot_timer.start()

          def process_events(stream):
              global last_passed, target_name, target_active, target_start_offset
              global active_transaction_seen
              while True:
                  line = stream.readline()
                  if not line:
                      return
                  match = re.match(r"^(Test [A-Za-z ]+) \(([^)]*)\)$", line.rstrip("\r\n"))
                  if not match:
                      continue
                  event, raw_name = match.groups()
                  name = safe_test_name(raw_name)
                  if event in ("Test Failed", "Test Errored"):
                      print(f"PHPUnit {event} ({name})", flush=True)
                  if event == "Test Passed":
                      last_passed = name
                  if event == "Test Preparation Started":
                      arm_test_watchdog(raw_name, name, stream.tell())
                  if event == "Test Preparation Started" and raw_name.endswith(target_method):
                      with observer_lock:
                          target_name = name
                          target_active = True
                          target_start_offset = stream.tell()
                      print(f"Test Passed ({last_passed or 'none observed'})", flush=True)
                      print(f"Test Started ({target_name}) [PHPUnit Test Preparation Started]", flush=True)
                      first_snapshot_done.clear()
                      start_second_snapshot_timer()
                      try:
                          saw_active_transaction = capture_mysql_state("at target start")
                          with observer_lock:
                              active_transaction_seen = saw_active_transaction
                      finally:
                          first_snapshot_done.set()
                  elif event == "Test Finished":
                      finish_test_watchdog(raw_name, name)
                      if name == target_name:
                          print(f"Test Finished ({name})", flush=True)
                          with observer_lock:
                              target_active = False
                              transaction_already_seen = active_transaction_seen
                          if not transaction_already_seen and second_snapshot_timer is not None:
                              second_snapshot_timer.cancel()
                  elif name == target_name and event in ("Test Passed", "Test Skipped"):
                      print(f"Target outcome {event} ({name})", flush=True)

          command = [
              "vendor/bin/phpunit", "-c", "phpunit.xml", "--debug",
              "--fail-on-skipped", "--display-skipped", "--display-warnings",
          ]
          with open(log_path, "w", encoding="utf-8", errors="replace") as log:
              suite_env = env.copy()
              suite_env.pop("MYSQL_PWD", None)
              suite_env.pop("M9_MYSQL_VERIFY_PASSWORD", None)
              suite = subprocess.Popen(command, stdout=log, stderr=subprocess.STDOUT, env=suite_env)
              watchdog_thread = threading.Thread(
                  target=no_progress_watchdog,
                  name="phpunit-no-progress-watchdog",
                  daemon=True,
              )
              watchdog_thread.start()
              try:
                  with open(log_path, "r", encoding="utf-8", errors="replace") as events:
                      while suite.poll() is None:
                          process_events(events)
                          time.sleep(0.2)
                      process_events(events)
                  status = suite.wait()
              finally:
                  if suite.poll() is None:
                      suite.terminate()
                      try:
                          suite.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          suite.kill()
                          suite.wait()
                  with watchdog_condition:
                      watchdog_shutdown = True
                      active_tests.clear()
                      watchdog_condition.notify_all()
                  if watchdog_thread.is_alive():
                      watchdog_thread.join()

          if status != 0:
              emit_safe_rpc_diagnostic()
          try:
              os.unlink(log_path)
          except FileNotFoundError:
              pass
          if target_name is None:
              print("Required target CAS test lifecycle event was not observed in the full suite.", file=sys.stderr)
              raise SystemExit(1)
          raise SystemExit(status)
          PY

      - name: Required MySQL process-concurrency gate
        run: |
          set -euo pipefail
          for test in \
            tests/Feature/BillingIdentityConcurrencyTest.php \
            tests/Feature/ViesReviewConcurrencyTest.php \
            tests/Feature/PromotionReservationConcurrencyTest.php \
            tests/Feature/StripeSubscriptionConcurrencyTest.php \
            tests/Feature/WebsiteSlotAssignmentConcurrencyTest.php \
