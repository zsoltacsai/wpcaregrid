        run: php artisan system:check

      - name: HTTP smoke test against a running server (production caches)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan serve --host=127.0.0.1 --port=8000 > "$RUNNER_TEMP/serve.log" 2>&1 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8000/up > /dev/null && break; sleep 0.2; done
          php tests/smoke/http-smoke.php http://localhost:8000 --expect=marketing_only
          php artisan optimize:clear

      - name: HTTP smoke test in application mode (isolated loopback server)
        env:
          APP_ENV: testing
          CAREGRID_DEPLOYMENT_ENV: testing
          MARKETING_RELEASE_ENFORCEMENT_MODE: testing
          MARKETING_RELEASE_PROFILE: marketing_only
          APP_URL: http://127.0.0.1:8001
          APP_DEBUG: 'false'
          MAIL_MAILER: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
          STRIPE_ALLOW_LIVE_MODE: 'false'
          STRIPE_MODE: test
        run: |
          set -euo pipefail

          server_pid=''
          cleanup() {
            status=$?
            trap - EXIT
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
            if ! php artisan optimize:clear > /dev/null 2>&1; then
              echo "Application-mode smoke cache cleanup failed." >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          [[ "$DB_CONNECTION" == mysql \
            && "$DB_HOST" == 127.0.0.1 \
            && "$DB_PORT" == 3306 \
            && "$DB_DATABASE" == caregrid_test \
            && "$DB_USERNAME" == caregrid_ci \
            && -z "$DB_URL" \
            && "$CAREGRID_EXPECTED_DATABASE_DRIVER" == mysql ]]

          stripe_variable_count=0
          while IFS= read -r stripe_variable; do
            case "$stripe_variable" in
