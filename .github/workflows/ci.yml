# Continuous integration on Linux (docs/DEPLOYMENT.md, docs/RELEASE_CHECKLIST.md).
#
# Every job must pass. Missing test services fail the run instead of being
# skipped (CAREGRID_TEST_REQUIRE_SERVICES, WP_CAREGRID_TEST_STRICT,
# --fail-on-skipped). Nothing is deployed from here.
name: CI

on:
  push:
    branches:
      - claude/ecstatic-wozniak-oemyuf
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      connector_release_base:
        description: Base revision for Connector release validation when dispatching a maintenance branch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '22'
  PHP_EXTENSIONS: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath

jobs:
  quality:
    name: Quality (lint, style, dependencies, build, secrets)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify locked Actions dependencies for ci.yml
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_ACTIONS_LOCK_GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh extension install github/gh-actions-lock --pin v0.4.0
          verifier="$HOME/.local/share/gh/extensions/gh-actions-lock/gh-actions-lock"
          test -x "$verifier"
          echo "f9da98f2a6e9e0ae77deadf9a2319a8a86bb002b541cc3203b247cc59fb04842  $verifier" | sha256sum --check
          gh actions-lock --verify .github/workflows/ci.yml
          git diff --exit-code -- .github/workflows/ci.yml .github/workflows/actions.lock
          test -z "$(git status --porcelain -- .github/workflows/actions.lock)"

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Tracked secret-path policy tests
        run: python3 scripts/tests/repository-secret-path-policy-test.py

      - name: Staging diagnostics output and policy tests
        run: |
          python3 scripts/tests/staging-diagnostics-output-test.py
          python3 scripts/tests/staging-diagnostics-policy-test.py
          python3 scripts/tests/staging-diagnostics-provisioning-test.py
          python3 scripts/tests/staging-diagnostics-package-preparation-test.py
          python3 scripts/tests/staging-diagnostics-bootstrap-test.py
          python3 -m py_compile scripts/staging-diagnostics/provisioning/bootstrap.py scripts/staging-diagnostics/provisioning/provision.py scripts/staging-diagnostics/provisioning/verify.py scripts/staging-diagnostics/provisioning/rollback.py
          php scripts/tests/staging-diagnostics-parser-test.php
          php -l scripts/staging-diagnostics/read-m12-cache.php
          bash -n scripts/staging-diagnostics/dispatch.sh scripts/staging-diagnostics/run-m12-readback.sh scripts/staging-diagnostics/provisioning/activation-check.sh scripts/staging-diagnostics/provisioning/diagnostics-shell.sh scripts/staging-diagnostics/provisioning/run-m12-readback.sh scripts/staging-diagnostics/provisioning/prepare-package.sh
          bash -n scripts/tests/staging-diagnostics-linux-integration-test.sh

      - name: Debian 12 staging diagnostics integration
        run: >-
          docker run --rm --volume "$GITHUB_WORKSPACE:/workspace:ro" debian:12-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
          bash -lc "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq acl openssh-server sudo php-cli python3 git && cd /workspace && bash scripts/tests/staging-diagnostics-linux-integration-test.sh"

      - name: No local files, databases or keys in the repository
        run: python3 scripts/tests/repository-secret-path-policy.py

      - name: CI supply-chain policy
        run: python3 scripts/tests/ci-supply-chain-policy-test.py

      - name: Gitleaks archive verifier tests
        run: python3 scripts/tests/gitleaks-archive-test.py

      - name: Validate composer files
        run: |
          composer validate --strict --no-check-publish
          composer validate --strict --no-check-publish --working-dir=wordpress

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax (application, tests, connector)
        run: |
          find app bootstrap config database lang routes tests scripts/e2e wordpress/wp-caregrid-connector wordpress/tests -name '*.php' -print0 \
            | xargs -0 -n 50 -P 4 sh -c 'for f; do php -l "$f" > /dev/null || exit 255; done' sh

      - name: M8 fixture fingerprint contract
        run: php scripts/e2e/test-fingerprint-v2.php

      - name: Staging deploy privilege allowlist policy
        run: python3 scripts/tests/deploy-privilege-policy-test.py

      - name: Gate 1 fake-only transition and Linux lock regression
        run: sudo -n python3 scripts/tests/deploy-transition-state-machine-test.py

      - name: Exact-SHA release CI authorization policy
        run: python3 scripts/tests/verify-release-ci-test.py

      - name: Deployment receipt provenance policy
        run: python3 scripts/tests/deployment-receipt-test.py

      - name: Connector package version and source consistency
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          DISPATCH_BASE: ${{ inputs.connector_release_base }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" && -n "$DISPATCH_BASE" ]]; then
            if [[ ! "$DISPATCH_BASE" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "Connector release base must be an exact 40-character commit SHA." >&2
              exit 1
            fi
            base="$DISPATCH_BASE"
            if [[ "$(git cat-file -t "$base" 2>/dev/null || true)" != "commit" ]]; then
              echo "Connector release base does not identify a local commit." >&2
              exit 1
            fi
          else
            base="$EVENT_BASE"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then base="$(git merge-base origin/main HEAD)"; fi
          fi
          php scripts/check-connector-release.php "$base"
          bash scripts/tests/connector-release-version-gate-test.sh

      - name: Code style (Pint)
        run: vendor/bin/pint --test -v

      - name: PHP dependency advisories (application and connector test harness)
        run: |
          composer audit --locked --no-interaction
          composer audit --locked --no-interaction --working-dir=wordpress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: JavaScript contracts and M147-A safety tests (fake sinks; no network)
        run: npm test

      - name: npm advisories (high and critical)
        run: npm audit --audit-level=high

      - name: Secret scan (Gitleaks 8.30.0, verified archive, full history)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.0_linux_x64.tar.gz"
          curl --fail --show-error --location --max-filesize 20000000 --connect-timeout 15 --max-time 60 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz"
          python3 scripts/verify-gitleaks-archive.py "$archive" "$RUNNER_TEMP/gitleaks"
          "$RUNNER_TEMP/gitleaks" detect --source=. --config=.gitleaks.toml --redact --no-banner --verbose

  server:
    name: Server tests (PHP ${{ matrix.php }}, mysql)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Full server integration targets the production database engine only.
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: caregrid_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # A missing S3 or SFTP test service fails the run (tests/Support/StorageServers.php).
      CAREGRID_TEST_REQUIRE_SERVICES: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ env.PHP_EXTENSIONS }}
          coverage: none
          tools: composer:v2

      - name: Database for this job
        env:
          # Disposable test-service credential, scoped to database provisioning.
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          set -euo pipefail
          db_password="$(openssl rand -hex 32)"
          echo "::add-mask::$db_password"
          MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root --execute="CREATE DATABASE IF NOT EXISTS caregrid_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'caregrid_ci'@'%' IDENTIFIED BY '$db_password'; GRANT ALL PRIVILEGES ON caregrid_test.* TO 'caregrid_ci'@'%';"
          {
            echo "DB_CONNECTION=mysql"
            echo "DB_HOST=127.0.0.1"
            echo "DB_PORT=3306"
            echo "DB_DATABASE=caregrid_test"
            echo "DB_USERNAME=caregrid_ci"
            echo "DB_PASSWORD=$db_password"
            echo "DB_URL="
            echo "CAREGRID_EXPECTED_DATABASE_DRIVER=mysql"
            echo "CAREGRID_EXPECTED_DATABASE_VERSION=8.4"
            echo "M9_MYSQL_VERIFY_PASSWORD=$MYSQL_ROOT_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Views reference the Vite manifest.
      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: S3-compatible test service (moto)
        run: |
          pipx install 'moto[server]==5.2.4'
          # pipx links apps into its own bin directory (/opt/pipx_bin on GitHub runners).
          bin="$(pipx environment --value PIPX_BIN_DIR)"
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/moto_server" --help > /dev/null

      - name: SFTP test service (OpenSSH, dedicated user, key authentication, pinned host key)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq acl openssh-server
          sudo useradd --create-home --shell /bin/bash caregrid-sftp
          # No password, but not a locked account: sshd refuses keys for locked accounts without PAM.
          sudo usermod -p '*' caregrid-sftp
          dir="$RUNNER_TEMP/sftp"; mkdir -p "$dir"
          ssh-keygen -q -t ed25519 -N '' -f "$dir/client"
          sudo install -d -m 700 -o caregrid-sftp -g caregrid-sftp /home/caregrid-sftp/.ssh /home/caregrid-sftp/storage
          sudo install -m 600 -o caregrid-sftp -g caregrid-sftp "$dir/client.pub" /home/caregrid-sftp/.ssh/authorized_keys
          sudo ssh-keygen -q -t ed25519 -N '' -f /etc/ssh/caregrid_test_host_ed25519
          cp /etc/ssh/caregrid_test_host_ed25519.pub "$dir/host.pub"
          printf '%s\n' \
            'Port 2222' 'ListenAddress 127.0.0.1' 'HostKey /etc/ssh/caregrid_test_host_ed25519' \
            'PasswordAuthentication no' 'KbdInteractiveAuthentication no' 'PubkeyAuthentication yes' 'UsePAM no' \
            'AllowUsers caregrid-sftp' 'Subsystem sftp internal-sftp' 'PidFile /run/caregrid-test-sshd.pid' \
            | sudo tee /etc/ssh/caregrid_test_sshd_config > /dev/null
          sudo mkdir -p /run/sshd
          sudo /usr/sbin/sshd -t -f /etc/ssh/caregrid_test_sshd_config
          sudo /usr/sbin/sshd -f /etc/ssh/caregrid_test_sshd_config
          {
            echo "CAREGRID_TEST_SFTP_HOST=127.0.0.1"
            echo "CAREGRID_TEST_SFTP_PORT=2222"
            echo "CAREGRID_TEST_SFTP_USER=caregrid-sftp"
            echo "CAREGRID_TEST_SFTP_KEY=$dir/client"
            echo "CAREGRID_TEST_SFTP_HOST_KEY=$dir/host.pub"
            echo "CAREGRID_TEST_SFTP_ROOT=/home/caregrid-sftp/storage"
          } >> "$GITHUB_ENV"

      - name: Application environment
        run: |
          cp .env.example .env
          # CI has no persistent scheduler cache; keep health checks independent
          # from the disposable DB cache table after test transactions migrate.
          echo "CACHE_STORE=array" >> "$GITHUB_ENV"
          php artisan key:generate --force

      - name: Verify actual Laravel MySQL 8.4 connection
        run: php scripts/tests/assert-ci-mysql-driver.php

      - name: Migrations from an empty database, full rollback, and again
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
          php artisan migrate:status | tee /dev/stderr | grep -q Pending && exit 1 || true

      - name: Production caches build (config, routes, views, events)
        run: |
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          php artisan event:cache
          php artisan optimize:clear

      - name: Bounded typed RPC CAS diagnosis
        shell: bash
        run: |
          set -euo pipefail
          set +x
          diagnostic_log="$RUNNER_TEMP/typed-rpc-cas-phpunit.log"
          env -u M9_MYSQL_VERIFY_PASSWORD timeout --signal=TERM --kill-after=5s 90s \
            vendor/bin/phpunit -c phpunit.xml --debug --fail-on-skipped \
              --display-skipped --display-warnings \
              tests/Feature/Deployment/TransitionPersistenceBridgeTest.php \
              --filter 'test_typed_rpc_cas_is_atomic_and_exact_replay_returns_its_receipt' \
              >"$diagnostic_log" 2>&1 &
          test_pid=$!
          test_started=$SECONDS
          snapshot_captured=0

          capture_mysql_state() {
            timeout --signal=TERM --kill-after=2s 7s python3 -u - <<'PY'
          import os
          import re
          import subprocess
          import sys
          from concurrent.futures import ThreadPoolExecutor

          env = os.environ.copy()
          required = ("DB_HOST", "DB_PORT", "M9_MYSQL_VERIFY_PASSWORD")
          missing = [name for name in required if not env.get(name)]
          if missing:
              print("Required root MySQL diagnostic configuration is absent: " + ", ".join(missing), file=sys.stderr)
              raise SystemExit(1)
          env["MYSQL_PWD"] = env["M9_MYSQL_VERIFY_PASSWORD"]

          base = [
              "mysql", "--protocol=TCP", "--connect-timeout=3",
              "--host=" + env["DB_HOST"], "--port=" + env["DB_PORT"],
              "--user=root",
              "--batch", "--skip-column-names", "--quick",
          ]

          def redact_sql(value):
              value = re.sub(r"(?is)'(?:''|\\\\.|[^'\\\\])*'|\"(?:\"\"|\\\\.|[^\"\\\\])*\"", "<literal>", value)
              value = re.sub(r"(?i)\b(password|token|secret|authorization|api[_-]?key)\b\s*(?:=|:)\s*[^\s,;]+", r"\1=<redacted>", value)
              value = re.sub(r"(?i)\bhttps?://[^\s]+", "<url>", value)
              value = re.sub(r"\b(?:0x)?[a-f0-9]{32,}\b", "<hex>", value, flags=re.I)
              value = re.sub(r"(?<![A-Za-z_])\d+(?![A-Za-z_])", "<n>", value)
              return value[:240]

          def query(label, sql, render):
              try:
                  result = subprocess.run(
                      [*base, "--execute", sql], env=env, text=True,
                      stdout=subprocess.PIPE, stderr=subprocess.DEVNULL,
                      timeout=5, check=False,
                  )
              except subprocess.TimeoutExpired:
                  return label, ["unavailable (query timed out)."]
              except OSError:
                  return label, ["unavailable (mysql client could not run)."]
              if result.returncode != 0:
                  return label, ["unavailable (query failed; details suppressed)."]
              rows = result.stdout.splitlines()[:100]
              safe_rows = []
              for row in rows:
                  try:
                      safe_rows.append(render(row.split("\t")))
                  except Exception:
                      safe_rows.append("<malformed row suppressed>")
              return label, [f"{len(rows)} row(s).", *safe_rows]

          queries = (
              (
                  "SHOW FULL PROCESSLIST (thread, command, age, state, redacted SQL)",
                  "SHOW FULL PROCESSLIST",
                  lambda c: "thread={0} command={1} age_s={2} state={3} sql={4}".format(
                      c[0], c[4], c[5], c[6][:120], redact_sql(c[7]),
                  ) if len(c) >= 8 else "<malformed row suppressed>",
              ),
              (
                  "InnoDB data_locks (transaction/thread/event, object, mode/status, redacted record)",
                  "SELECT ENGINE_TRANSACTION_ID, THREAD_ID, EVENT_ID, OBJECT_SCHEMA, OBJECT_NAME, "
                  "INDEX_NAME, LOCK_TYPE, LOCK_MODE, LOCK_STATUS, "
                  "IF(LOCK_DATA IS NULL, 'NULL', '<present:redacted>') "
                  "FROM performance_schema.data_locks WHERE ENGINE = 'INNODB' LIMIT 100",
                  lambda c: "trx={0} thread={1} event={2} object={3}.{4} index={5} "
                            "type={6} mode={7} status={8} record={9}".format(*c),
              ),
              (
                  "InnoDB data_lock_waits (waiting/blocking links and lock objects)",
                  "SELECT w.REQUESTING_ENGINE_TRANSACTION_ID, r.THREAD_ID, r.EVENT_ID, "
                  "r.OBJECT_SCHEMA, r.OBJECT_NAME, r.INDEX_NAME, r.LOCK_TYPE, r.LOCK_MODE, r.LOCK_STATUS, "
                  "w.BLOCKING_ENGINE_TRANSACTION_ID, b.THREAD_ID, b.EVENT_ID, "
                  "b.OBJECT_SCHEMA, b.OBJECT_NAME, b.INDEX_NAME, b.LOCK_TYPE, b.LOCK_MODE, b.LOCK_STATUS "
                  "FROM performance_schema.data_lock_waits AS w "
                  "LEFT JOIN performance_schema.data_locks AS r "
                  "ON r.ENGINE = w.ENGINE AND r.ENGINE_LOCK_ID = w.REQUESTING_ENGINE_LOCK_ID "
                  "LEFT JOIN performance_schema.data_locks AS b "
                  "ON b.ENGINE = w.ENGINE AND b.ENGINE_LOCK_ID = w.BLOCKING_ENGINE_LOCK_ID "
                  "WHERE w.ENGINE = 'INNODB' LIMIT 100",
                  lambda c: "waiting_trx={0} thread={1} event={2} object={3}.{4} index={5} "
                            "type={6} mode={7} status={8}; blocking_trx={9} thread={10} event={11} "
                            "object={12}.{13} index={14} type={15} mode={16} status={17}".format(*c),
              ),
              (
                  "Active InnoDB transactions (IDs, age, wait and row counts; SQL suppressed)",
                  "SELECT TRX_ID, TRX_STATE, TIMESTAMPDIFF(SECOND, TRX_STARTED, NOW()), "
                  "TRX_WAIT_STARTED IS NOT NULL, TRX_MYSQL_THREAD_ID, TRX_ROWS_LOCKED, "
                  "TRX_ROWS_MODIFIED, TRX_QUERY IS NOT NULL "
                  "FROM information_schema.innodb_trx LIMIT 100",
                  lambda c: "trx={0} state={1} age_s={2} waiting={3} thread={4} "
                            "rows_locked={5} rows_modified={6} active_sql={7}".format(*c),
              ),
          )
          with ThreadPoolExecutor(max_workers=4) as executor:
              for label, rows in executor.map(lambda item: query(*item), queries):
                  print(f"{label}: {rows[0]}")
                  for row in rows[1:]:
                      print(row)
          PY
          }

          process_running() {
            local state
            state="$(ps -o stat= -p "$test_pid" 2>/dev/null | tr -d '[:space:]')"
            [ -n "$state" ] && [ "${state:0:1}" != "Z" ]
          }

          while process_running; do
            elapsed=$((SECONDS - test_started))
            if [ "$elapsed" -ge 80 ]; then
              snapshot_captured=1
              echo 'Typed RPC CAS still running at 80s; collecting MySQL state before the 90s test timeout.' >&2
              if ! capture_mysql_state; then
                echo 'Bounded MySQL snapshot collection did not finish successfully.' >&2
              fi
              break
            fi
            sleep 0.25
          done

          set +e
          wait "$test_pid"
          test_status=$?
          set -e

          # If PHPUnit failed before the pre-deadline observer fired, collect
          # the same redacted snapshot after failure for diagnostic context.
          if [ "$test_status" -ne 0 ] && [ "$snapshot_captured" -eq 0 ]; then
            echo "Typed RPC CAS diagnostic failed (status $test_status); collecting MySQL state." >&2
            if ! capture_mysql_state; then
              echo 'Bounded MySQL snapshot collection did not finish successfully.' >&2
            fi
          fi

          # Emit only PHPUnit lifecycle labels, never assertion/SQL output.
          if [ -f "$diagnostic_log" ]; then
            grep -E '^Test (Preparation|Started|Passed|Failed|Errored|Skipped|Finished|Suite)' \
              "$diagnostic_log" | tail -n 40 || true
          fi
          rm -f "$diagnostic_log"

          if [ "$test_status" -eq 0 ]; then
            echo 'Typed RPC CAS diagnostic passed; continuing to the full suite.'
            exit 0
          fi
          if [ "$test_status" -eq 124 ] || [ "$test_status" -eq 137 ]; then
            echo 'Typed RPC CAS diagnostic exceeded its 90s deadline; failing explicitly after evidence capture.' >&2
          else
            echo "Typed RPC CAS diagnostic failed (status $test_status); failing before the full suite." >&2
          fi
          exit 1

      - name: Bounded isolated unprivileged peer RPC test
        shell: bash
        run: |
          set -euo pipefail
          set +x
          diagnostic_log="$RUNNER_TEMP/peer-rpc-isolated-phpunit.log"
          trap 'rm -f "$diagnostic_log"' EXIT

          set +e
          env -u M9_MYSQL_VERIFY_PASSWORD timeout --signal=TERM --kill-after=5s 90s \
            vendor/bin/phpunit -c phpunit.xml --debug --fail-on-skipped \
              --display-skipped --display-warnings \
              tests/Feature/Deployment/TransitionPersistenceBridgeTest.php \
              --filter 'test_artisan_rpc_runs_as_unprivileged_peer_and_checks_so_peercred' \
              >"$diagnostic_log" 2>&1
          test_status=$?
          set -e

          python3 - "$diagnostic_log" "$test_status" <<'PY'
          import re
          import sys

          log_path, raw_status = sys.argv[1:]
          try:
              test_status = int(raw_status)
          except ValueError:
              print("Isolated peer RPC test failed (status unavailable).")
              raise SystemExit(1)

          safe_diagnostic = re.compile(
              r"(?:phase=preflight; probe=(?:php_version|cache_setup|artisan_list|command_help); state=(?:timeout|failed|command_missing)(?:; exit_code=-?\d+)?(?:; errno=-?\d+)?|"
              r"phase=preflight; probe=artisan_version; state=timeout(?:; exit_code=-?\d+)?(?:; errno=-?\d+)?|"
              r"phase=preflight; probe=artisan_version; state=failed(?:; exit_code=-?\d+)?(?:; errno=-?\d+)?(?:; cause=(?:CACHE_MANIFEST_WRITE|CACHE_MANIFEST_READ|CONFIG_CACHE_LOAD|PHP_AUTOLOAD_OR_BOOTSTRAP|DB_OR_PROVIDER_BOOT|CONSOLE_BOOTSTRAP|APP_PROVIDER_BOOT|SQLITE_OR_PDO_BOOT|SYMFONY_CONSOLE_BOOT_OR_REGISTRATION|PHP_PARSE_OR_RUNTIME_FATAL|EMPTY_DIAGNOSTIC|INPUT_PARENT_TRAVERSE_DENIED|INPUT_SCRIPT_MISSING|INPUT_SCRIPT_NOT_REGULAR|INPUT_SCRIPT_UNREADABLE|INPUT_SCRIPT_READABLE|INPUT_ACCESS_CHECK_FAILED|PHP_STARTUP|APP_KEY_CONFIG|PHP_WARNING|OTHER_EXCEPTION|OTHER_NONEMPTY_OUTPUT|UNCLASSIFIED))?|"
              r"phase=(?:accept_timeout|response_timeout|child_wait_timeout); child_state=running|"
              r"phase=(?:accept|response|child); child_state=exited; exit_code=-?\d+)"
          )
          diagnostics = set()
          try:
              with open(log_path, "r", encoding="utf-8", errors="replace") as recorded:
                  for line in recorded:
                      diagnostics.update(match.group(0) for match in safe_diagnostic.finditer(line))
          except OSError:
              print("Isolated peer RPC test failed; safe diagnostic log unavailable.")
              raise SystemExit(1)

          for diagnostic in sorted(diagnostics):
              print(diagnostic)
          if test_status == 0:
              print("Isolated peer RPC test passed; continuing to the full suite.")
              raise SystemExit(0)
          if not diagnostics:
              print("Isolated peer RPC test failed; no allowlisted diagnostic was captured.")
          elif test_status in (124, 137):
              print("Isolated peer RPC test exceeded its 90s deadline.")
          else:
              print("Isolated peer RPC test failed (status {}).".format(test_status))
          raise SystemExit(1)
          PY

      - name: Test suite
