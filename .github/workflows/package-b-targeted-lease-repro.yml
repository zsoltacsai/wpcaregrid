name: Package B targeted lease reproduction — diagnostic only

on:
  push:
    branches:
      - codex/package-b-targeted-lease-repro

permissions:
  contents: read

concurrency:
  group: package-b-targeted-lease-repro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  targeted-lease-test:
    name: Targeted Package B lease test (PHP ${{ matrix.php }}, disposable MySQL)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, gd, zip, sodium, pdo_sqlite, sqlite3, pdo_mysql, mysqli, fileinfo, openssl, curl, posix, pcntl, bcmath
          coverage: none
          tools: composer:v2

      - name: Install locked dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Provision fresh disposable application database
        shell: bash
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        run: |
          set -euo pipefail
          set +x
          app_password="$(openssl rand -hex 32)"
          echo "::add-mask::$app_password"
          printf "SET GLOBAL log_bin_trust_function_creators=1; CREATE DATABASE caregrid_test CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci; CREATE USER 'caregrid_ci'@'%%' IDENTIFIED BY '%s'; GRANT ALL PRIVILEGES ON caregrid_test.* TO 'caregrid_ci'@'%%';\n" "$app_password" \
            | MYSQL_PWD="$MYSQL_ROOT_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user=root >/dev/null 2>&1
          {
            printf '%s\n' 'DB_CONNECTION=mysql' 'DB_HOST=127.0.0.1' 'DB_PORT=3306'
            printf '%s\n' 'DB_DATABASE=caregrid_test' 'DB_USERNAME=caregrid_ci' "DB_PASSWORD=$app_password" 'DB_URL='
            printf '%s\n' 'CAREGRID_EXPECTED_DATABASE_DRIVER=mysql' 'CAREGRID_EXPECTED_DATABASE_VERSION=8.4'
          } >> "$GITHUB_ENV"

      - name: Verify disposable application database connection
        shell: bash
        run: |
          set -euo pipefail
          if ! MYSQL_PWD="$DB_PASSWORD" mysql --protocol=TCP --host=127.0.0.1 --port=3306 --user="$DB_USERNAME" "$DB_DATABASE" --execute='SELECT 1' >/dev/null 2>&1; then
            echo 'APP_DATABASE=FAIL'
            exit 1
          fi
          echo 'APP_DATABASE=PASS'

      - name: Synthetic selection and redaction contract
        run: python3 scripts/ci/package-b-targeted-lease-repro.py --self-test

      - name: Run exactly one selected test without JUnit
        shell: bash
        run: python3 scripts/ci/package-b-targeted-lease-repro.py --run --php-version '${{ matrix.php }}'
