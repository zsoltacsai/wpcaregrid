# wpcaregrid-php-fpm-confinement 1.0.1 -- drop-in for the existing staging-next php8.5-fpm.service.
# Install as /etc/systemd/system/php8.5-fpm.service.d/90-wpcaregrid-confinement.conf.
# Deliberately does not touch User, Exec*, sockets or ordering of the packaged unit.
# Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-php-fpm-staging-next
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectProc=invisible
ProcSubset=pid
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/var/www/wpcaregrid-production -/var/lib/wpcaregrid-deploy/production -/var/www/wpcaregrid -/var/lib/wpcaregrid -/etc/wpcaregrid-deploy
InaccessiblePaths=-/var/lib/wpcaregrid-deploy/staging-next/incoming -/var/lib/wpcaregrid-deploy/staging-next/inbox -/var/lib/wpcaregrid-deploy/staging-next/state -/var/lib/wpcaregrid-deploy/staging-next/receipts -/var/lib/wpcaregrid-deploy/staging-next/database-backups
