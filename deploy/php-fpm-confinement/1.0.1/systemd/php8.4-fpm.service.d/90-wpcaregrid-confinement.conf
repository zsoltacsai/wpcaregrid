# wpcaregrid-php-fpm-confinement 1.0.1 -- drop-in for the existing shared php8.4-fpm.service.
# Install as /etc/systemd/system/php8.4-fpm.service.d/90-wpcaregrid-confinement.conf.
# Deny-overlay only (see apparmor/wpcaregrid-php-fpm-staging-legacy): the pool also serves
# sibling vhosts, so no allowlist and no ProtectSystem/ProtectHome that could break them.
# Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-php-fpm-staging-legacy
NoNewPrivileges=yes
ProtectProc=invisible
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/var/www/wpcaregrid-production -/var/lib/wpcaregrid-deploy/production -/var/www/wpcaregrid-staging-new -/var/lib/wpcaregrid-deploy/staging-next -/etc/wpcaregrid-deploy
