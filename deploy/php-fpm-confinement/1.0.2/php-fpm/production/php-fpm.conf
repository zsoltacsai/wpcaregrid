; wpcaregrid-php-fpm-confinement 1.0.2 -- production FPM master configuration.
; Install as /etc/php/8.4/fpm-wpcaregrid-production/php-fpm.conf (root:root 0644).
; Source artifact: not installed.
[global]
daemonize = no
error_log = /var/log/wpcaregrid-production/php-fpm.log
log_level = warning
systemd_interval = 10
include = /etc/php/8.4/fpm-wpcaregrid-production/pool.d/*.conf
