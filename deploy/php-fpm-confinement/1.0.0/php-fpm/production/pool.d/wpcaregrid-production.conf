; wpcaregrid-php-fpm-confinement 1.0.0 -- the only production pool.
; Install as /etc/php/8.4/fpm-wpcaregrid-production/pool.d/wpcaregrid-production.conf (root:root 0644).
; Process sizing mirrors docs/DEPLOYMENT.md (4 GB host: pm.max_children = 10).
; open_basedir is defense in depth for PHP stream functions only; it is not a
; security boundary and does not replace the AppArmor profile.
; Source artifact: not installed.
[wpcaregrid-production]
user = www-data
group = www-data
listen = /run/php/wpcaregrid-production-php8.4-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 10
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
php_admin_value[open_basedir] = /var/www/wpcaregrid-production/:/var/lib/wpcaregrid-deploy/production/shared/:/tmp/:/usr/share/zoneinfo/:/etc/ssl/certs/:/dev/urandom
php_admin_value[upload_max_filesize] = 16M
php_admin_value[post_max_size] = 16M
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_admin_value[session.upload_progress.enabled] = 0
php_admin_flag[expose_php] = off
