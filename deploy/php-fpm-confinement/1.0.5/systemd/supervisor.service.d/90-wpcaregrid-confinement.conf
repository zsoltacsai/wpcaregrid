# wpcaregrid-php-fpm-confinement 1.0.5 -- drop-in for the existing supervisor.service (queue workers as www-data).
# Install as /etc/systemd/system/supervisor.service.d/90-wpcaregrid-confinement.conf, only at its stage.
# Every worker Supervisor starts inherits the profile. Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-php-cli-staging
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectProc=invisible
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/var/www/wpcaregrid-production -/var/lib/wpcaregrid-deploy/production -/etc/wpcaregrid-deploy
