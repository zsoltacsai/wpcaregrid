# wpcaregrid-php-fpm-confinement 1.0.5 -- drop-in for the legacy staging scheduler service (replaces the www-data cron entry).
# Install as /etc/systemd/system/wpcaregrid-staging-legacy-scheduler.service.d/90-wpcaregrid-confinement.conf,
# only at its stage. Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-php-cli-staging
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectProc=invisible
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/var/www/wpcaregrid-production -/var/lib/wpcaregrid-deploy/production -/etc/wpcaregrid-deploy
