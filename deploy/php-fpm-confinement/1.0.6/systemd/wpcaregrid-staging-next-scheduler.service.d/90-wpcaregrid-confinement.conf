# wpcaregrid-php-fpm-confinement 1.0.6 -- drop-in for the existing staging-next scheduler service.
# Install as /etc/systemd/system/wpcaregrid-staging-next-scheduler.service.d/90-wpcaregrid-confinement.conf,
# only at its stage. Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-php-cli-staging
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectProc=invisible
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/var/www/wpcaregrid-production -/var/lib/wpcaregrid-deploy/production -/etc/wpcaregrid-deploy
