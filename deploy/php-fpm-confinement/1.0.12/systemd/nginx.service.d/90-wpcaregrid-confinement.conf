# wpcaregrid-php-fpm-confinement 1.0.12 -- drop-in for the existing nginx.service (www-data workers).
# Install as /etc/systemd/system/nginx.service.d/90-wpcaregrid-confinement.conf, only at its stage.
# Touches no User, Exec*, listen or ordering. Source artifact: not installed.
[Service]
AppArmorProfile=wpcaregrid-nginx
NoNewPrivileges=yes
PrivateTmp=yes
ProtectHome=yes
ProtectProc=invisible
StandardInput=null
FileDescriptorStoreMax=0
InaccessiblePaths=-/etc/wpcaregrid-deploy -/var/lib/wpcaregrid-deploy/production/shared
InaccessiblePaths=-/var/lib/wpcaregrid-deploy/production/incoming -/var/lib/wpcaregrid-deploy/production/inbox -/var/lib/wpcaregrid-deploy/production/receipts -/var/lib/wpcaregrid-deploy/production/database-backups
