[www]
user = www-data
group = www-data
listen = /tmp/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
pm = static
pm.max_children = 2
request_terminate_timeout = 8s
clear_env = yes
catch_workers_output = yes
decorate_workers_output = no
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_flag[opcache.enable] = on
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.memory_consumption] = 64
env[PATH] = /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
env[HOME] = /tmp
env[APP_ENV] = testing
env[APP_KEY] = $APP_KEY
env[APP_URL] = http://127.0.0.1:8080
env[CAREGRID_DEPLOYMENT_ENV] = testing
env[MARKETING_RELEASE_PROFILE] = marketing_only
env[MARKETING_RELEASE_ENFORCEMENT_MODE] = testing
env[DB_CONNECTION] = sqlite
env[DB_DATABASE] = /tmp/caregrid.sqlite
env[CACHE_STORE] = array
env[SESSION_DRIVER] = array
env[QUEUE_CONNECTION] = database
env[DB_QUEUE] = default
env[RES_OPTIONS] = attempts:1 timeout:1
env[MAIL_MAILER] = array
env[FILESYSTEM_DISK] = local
env[STRIPE_ALLOW_LIVE_MODE] = 0
env[STRIPE_MODE] = test
env[LOG_CHANNEL] = stderr
env[FPM_WITNESS_PORT4] = $FPM_WITNESS_PORT4
env[FPM_WITNESS_PORT6] = $FPM_WITNESS_PORT6
env[FPM_WITNESS_IPV4] = $FPM_WITNESS_IPV4
